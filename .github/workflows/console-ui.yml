name: Console UI

on:
  push:

permissions:
  contents: read

concurrency:
  group: console-ui-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  console-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Biome check (console UI)
        run: npx biome check src/adapter/entry-points/console/ui

      - name: Type check (console UI)
        run: npx tsc --noEmit -p src/adapter/entry-points/console/ui/tsconfig.json

      - name: Type check (console UI E2E)
        run: npm run console-ui:e2e:typecheck

      - name: Build console UI (Vite)
        run: npm run build:console-ui

      - name: Copy console UI dist to served bundle path
        run: node scripts/copyConsoleUiDist.mjs

      - name: Verify served console UI bundle matches source
        run: node scripts/verifyConsoleUiDist.mjs

      - name: Install Playwright browsers (console UI E2E)
        run: npx playwright install --with-deps chromium

      - name: Run console UI browser E2E (Playwright)
        run: npx playwright test --config src/adapter/entry-points/console/ui/e2e/playwright.config.ts

      - name: Upload console UI E2E report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-ui-e2e-report
          path: src/adapter/entry-points/console/ui/e2e/report
          if-no-files-found: ignore

      - name: Build Storybook (console UI)
        run: npm run console-ui:build-storybook

      - name: Upload Storybook static
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-ui-storybook
          path: src/adapter/entry-points/console/ui/storybook-static
