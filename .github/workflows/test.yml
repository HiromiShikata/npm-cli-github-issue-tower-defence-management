name: Test

on:
  push:

concurrency:
  group: test-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci

      - name: Build native modules
        working-directory: node_modules/better-sqlite3
        run: node ../prebuild-install/bin.js || npm exec --yes -- node-gyp rebuild --release

      - name: Prepare
        run: npm run prepare

      - name: Build
        run: npm run build

      - name: Build console UI and copy to served bundle path
        run: npm run build:console-ui && node scripts/copyConsoleUiDist.mjs

      - name: Run tests
        run: npm run test
        env:
          GH_TOKEN: ${{ secrets.TEST_GH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.TEST_GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SHEETS_INTEGRATION_REQUIRED: 'false'
          SLACK_USER_TOKEN: ${{ secrets.TEST_SLACK_USER_TOKEN }}
          DOTENV_CONFIG_QUIET: true

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jest-junit-report
          path: reports/jest-junit

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: reports

      - name: Find associated pull request
        id: find_pr
        if: github.ref_name != github.event.repository.default_branch
        run: |
          RAW_PR_NUMBER=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?head=${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}&state=open&per_page=1" \
            --jq '.[0].number // ""' 2>/dev/null || echo "")
          PR_NUMBER=$(bash scripts/sanitizePrNumber.sh "${RAW_PR_NUMBER}")
          echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Check for deleted or weakened test assertions
        if: github.ref_name != github.event.repository.default_branch
        run: bash scripts/assertionWeakeningCheck.sh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_BASE_REF: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ steps.find_pr.outputs.pr_number }}

  live-project-items-test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci

      - name: Build native modules
        working-directory: node_modules/better-sqlite3
        run: node ../prebuild-install/bin.js || npm exec --yes -- node-gyp rebuild --release

      - name: Prepare
        run: npm run prepare

      - name: Build
        run: npm run build

      - name: Build console UI and copy to served bundle path
        run: npm run build:console-ui && node scripts/copyConsoleUiDist.mjs

      - name: Run live project items test
        run: npm run test:live-project-items
        env:
          GH_TOKEN: ${{ secrets.TEST_GH_TOKEN }}
