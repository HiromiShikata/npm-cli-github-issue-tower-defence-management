name: Publish

on:
  push:
    branches:
      - main

jobs:
  verify-test-workflow-conclusion:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
      - name: Require a successful test workflow conclusion for the pushed commit
        run: ./scripts/testWorkflowRunVerify.sh
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_WORKFLOW_FILE: test.yml
          VERIFIED_COMMIT_SHA: ${{ github.sha }}
          REQUIRED_CONCLUSION: success
          POLL_INTERVAL_SECONDS: 15
          POLL_TIMEOUT_SECONDS: 1800

  publish:
    needs: verify-test-workflow-conclusion
    runs-on: ubuntu-latest
    concurrency:
      group: publish-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      RELEASE_APP_ID: 795363
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      PJ_GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            registry.npmjs.org:443
            nodejs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            oauth2.sigstore.dev:443
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ env.RELEASE_APP_ID }}
          private-key: ${{ env.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci
      - run: npm run prepare
      - run: npm run build
      - name: Regenerate served console UI bundle
        run: npm run build:console-ui && node scripts/copyConsoleUiDist.mjs
      - name: Verify served console UI bundle matches source
        run: node scripts/verifyConsoleUiDist.mjs
      - run: git config --global user.email "gh-actions"
      - run: git config --global user.name "gh-actions"

      - name: Resolve whether the pushed commit is still the default branch tip
        id: default-branch-tip
        run: ./scripts/defaultBranchTipVerify.sh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERIFIED_COMMIT_SHA: ${{ github.sha }}

      - run: npx semantic-release
        if: steps.default-branch-tip.outputs.releasable == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      - if: steps.default-branch-tip.outputs.releasable == 'true'
        run: |
          git status
          git add -A
      - if: steps.default-branch-tip.outputs.releasable == 'true'
        run: |
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "autogen: release"
            git pull --rebase origin main
            if ! git push origin main; then
              git pull --rebase origin main
              git push origin main
            fi
          fi
