name: Scripts TypeScript CI

on:
  pull_request:
    paths:
      - 'scripts/typescript/**'

concurrency:
  group: scripts-typescript-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: scripts/typescript
      - name: Lint
        run: npm run lint
        working-directory: scripts/typescript
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: scripts/typescript
      - name: Test (changed since base)
        run: npx jest --changedSince=origin/${{ github.event.pull_request.base.ref }}
        working-directory: scripts/typescript
